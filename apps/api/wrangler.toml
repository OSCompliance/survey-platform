name = "survey-platform-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "survey-platform-db"
# Replace with the database_id returned by:
#   wrangler d1 create survey-platform-db
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Comma-separated list of origins allowed to call this API.
CORS_ALLOWED_ORIGINS = "http://localhost:5173"
# Set to "true" to require a valid Turnstile token on public submissions.
# Leave "false" for local development, where no Turnstile keys are configured.
TURNSTILE_ENFORCED = "false"

# Secrets (never committed): set with `wrangler secret put <NAME>`
#   JWT_SECRET            - long random string used to sign session tokens
#   TURNSTILE_SECRET_KEY  - Cloudflare Turnstile secret key (production only)
